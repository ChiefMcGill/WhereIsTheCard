services:
  whereisthecard:
    build:
      context: .
    container_name: whereisthecard
    restart: unless-stopped
    command: gunicorn --bind 0.0.0.0:8000 --workers 2 "app:create_app()"
    environment:
      TZ: Africa/Johannesburg
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: sqlite:////data/app.db
      SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES:-15}
      CARD_CHECKOUT_MINUTES: ${CARD_CHECKOUT_MINUTES:-60}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      MAIL_FROM: ${MAIL_FROM}
      FINANCE_EMAIL: ${FINANCE_EMAIL:-finance@solidground.co.za}
      SENIOR_PASTOR_EMAIL: ${SENIOR_PASTOR_EMAIL}
    volumes:
      - /mnt/docker/docker/data/whereisthecard:/data
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - default
      - lan

  whereisthecard-worker:
    build:
      context: .
    container_name: whereisthecard-worker
    restart: unless-stopped
    command: python -m app.worker
    environment:
      TZ: Africa/Johannesburg
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: sqlite:////data/app.db
      SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES:-15}
      CARD_CHECKOUT_MINUTES: ${CARD_CHECKOUT_MINUTES:-60}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      MAIL_FROM: ${MAIL_FROM}
      FINANCE_EMAIL: ${FINANCE_EMAIL:-finance@solidground.co.za}
      SENIOR_PASTOR_EMAIL: ${SENIOR_PASTOR_EMAIL}
    volumes:
      - /mnt/docker/docker/data/whereisthecard:/data
    networks:
      - default
      - lan

networks:
  lan:
    external: true
