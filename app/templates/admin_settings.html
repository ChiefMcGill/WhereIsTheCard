{% extends 'base.html' %}
{% block content %}
<h1>Email settings</h1>
<div class="card p-3 mb-4">
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">SMTP host</label>
                <input class="form-control" type="text" name="SMTP_HOST" value="{{ settings['SMTP_HOST'] }}" placeholder="smtp.example.com">
            </div>
            <div class="col-md-3">
                <label class="form-label">SMTP port</label>
                <input class="form-control" type="number" name="SMTP_PORT" value="{{ settings['SMTP_PORT'] }}" placeholder="587">
            </div>
            <div class="col-md-3">
                <label class="form-label">Use TLS</label>
                <select class="form-select" name="SMTP_USE_TLS">
                    <option value="true" {% if settings['SMTP_USE_TLS']|lower == 'true' %}selected{% endif %}>Yes</option>
                    <option value="false" {% if settings['SMTP_USE_TLS']|lower != 'true' %}selected{% endif %}>No</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">SMTP username</label>
                <input class="form-control" type="text" name="SMTP_USERNAME" value="{{ settings['SMTP_USERNAME'] }}" placeholder="you@example.com">
            </div>
            <div class="col-md-6">
                <label class="form-label">SMTP password</label>
                <input class="form-control" type="password" name="SMTP_PASSWORD" value="{{ settings['SMTP_PASSWORD'] }}" placeholder="Password">
            </div>
            <div class="col-md-6">
                <label class="form-label">From address</label>
                <input class="form-control" type="email" name="MAIL_FROM" value="{{ settings['MAIL_FROM'] }}" placeholder="no-reply@solidground.co.za">
            </div>
            <div class="col-md-6">
                <label class="form-label">Finance email</label>
                <input class="form-control" type="email" name="FINANCE_EMAIL" value="{{ settings['FINANCE_EMAIL'] }}" placeholder="finance@solidground.co.za">
            </div>
            <div class="col-md-6">
                <label class="form-label">Senior pastor email</label>
                <input class="form-control" type="email" name="SENIOR_PASTOR_EMAIL" value="{{ settings['SENIOR_PASTOR_EMAIL'] }}" placeholder="seniorpastor@solidground.co.za">
            </div>
            <div class="col-md-6">
                <label class="form-label">Senior pastor alert threshold (minutes)</label>
                <input class="form-control" type="number" min="0" step="5" name="SENIOR_PASTOR_NOTIFICATION_THRESHOLD_MINUTES" value="{{ settings['SENIOR_PASTOR_NOTIFICATION_THRESHOLD_MINUTES'] }}" placeholder="60">
            </div>
        </div>
        <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save email settings</button>
            <button type="submit" formaction="{{ url_for('admin_settings_test_email') }}" class="btn btn-outline-secondary">Send test email</button>
        </div>
    </form>
</div>
{% endblock %}
